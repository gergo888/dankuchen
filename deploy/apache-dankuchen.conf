# A dankuchenkaposvar.hu virtual hostja. Helye a szerveren: /etc/apache2/sites-available/zz-dankuchenkaposvar.hu.conf
# Kell hozzá: a2enmod proxy_http ssl rewrite headers
#
# A zz- előtag fontos. Az Apache betűrendben tölti be a fájlokat, és az ismeretlen domainű kéréseket
# az első virtual host kapja. Ennek továbbra is a webáruháznak kell lennie.

<VirtualHost *:80>
    ServerName dankuchenkaposvar.hu
    ServerAlias www.dankuchenkaposvar.hu
    RewriteEngine On
    RewriteRule ^ https://dankuchenkaposvar.hu%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog ${APACHE_LOG_DIR}/dankuchen-error.log
    CustomLog ${APACHE_LOG_DIR}/dankuchen-access.log geocombined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dankuchenkaposvar.hu
    ServerAlias www.dankuchenkaposvar.hu
    DocumentRoot /var/www/dankuchen

    # A www változat a domain gyökerére irányít.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://dankuchenkaposvar.hu%{REQUEST_URI} [END,NE,R=permanent]

    <Directory /var/www/dankuchen>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        DirectoryIndex index.html
        AddType image/webp .webp
        AddType font/woff2 .woff2
        # A robots.txt és az llms.txt ékezetes szövegéhez.
        AddCharset UTF-8 .txt
        Require all granted

        # A HTML-t a böngésző mindig ellenőrzi, így telepítés után azonnal az új oldal látszik.
        # A gzip miatt az ETag-gel sosem jönne 304-es válasz, a Last-Modified fejléccel igen.
        <FilesMatch "\.html$">
            Header set Cache-Control "no-cache"
            Header unset ETag
        </FilesMatch>
    </Directory>

    # Saját hibaoldal a nem létező címekre (frontend/src/pages/404.astro).
    ErrorDocument 404 /404.html

    # Ezeknek a fájloknak a nevében tartalomból képzett hash van, ezért sosem változnak.
    <Location /_astro/>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>

    # Az időpontfoglaló API (Node, csak helyben érhető el).
    ProxyPass        /api/ http://127.0.0.1:4322/api/
    ProxyPassReverse /api/ http://127.0.0.1:4322/api/

    # A szerverszintű phpMyAdmin-alias ezen a domainen ne legyen elérhető.
    <Location /phpmyadmin>
        Require all denied
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/dankuchen-error.log
    CustomLog ${APACHE_LOG_DIR}/dankuchen-access.log geocombined

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/dankuchenkaposvar.hu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dankuchenkaposvar.hu/privkey.pem
</VirtualHost>
</IfModule>
