# A /etc/apache2/sites-available/default-ssl.conf virtual hostjába, az "Alias /dankuchen" blokk után.
# Kell hozzá: a2enmod proxy_http

# Időpontfoglaló API (Node, csak helyben érhető el). A ProxyPass megelőzi az Alias szabályt.
ProxyPass        /dankuchen/api http://127.0.0.1:4322/dankuchen/api
ProxyPassReverse /dankuchen/api http://127.0.0.1:4322/dankuchen/api

# A <Directory> jelszóvédelem a proxizott útvonalra nem vonatkozik.
# Éles induláskor az oldal védelmével együtt törlendő.
<Location /dankuchen/api>
    AuthType Basic
    AuthName "DANKUCHEN Kaposvar"
    AuthUserFile /etc/apache2/.htpasswd-dankuchen
    Require valid-user
</Location>
